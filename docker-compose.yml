services:
  spec-decode:
    build: .
    container_name: spec-decode-web
    ports:
      - "8000:8000"
    environment:
      - OMP_NUM_THREADS=2
      # 应用内固定 torch 线程数，保证 argmax 判定可复现（与上面的 OMP 设置一致）
      - SPEC_DECODE_THREADS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
